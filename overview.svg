<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="'Segoe UI', Arial, sans-serif" role="img" aria-label="Animated overview of the full data engineering pipeline across seven stages">
  <defs>
    <linearGradient id="ovbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a2b"/><stop offset="0.5" stop-color="#102234"/><stop offset="1" stop-color="#0c231f"/>
    </linearGradient>
    <linearGradient id="ovpipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff"/><stop offset="0.25" stop-color="#5fa0ff"/><stop offset="0.5" stop-color="#38b2f0"/><stop offset="0.75" stop-color="#1fd0a8"/><stop offset="1" stop-color="#1ec997"/>
    </linearGradient>
    <radialGradient id="ovorb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38b2f0" stop-opacity=".2"/><stop offset="1" stop-color="#38b2f0" stop-opacity="0"/></radialGradient>
    <filter id="ovsh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="dotglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font-size:27px;font-weight:800;fill:#ffffff}
      .sub{font-size:14px;fill:#aebccb}
      .snum{font-size:14px;font-weight:900}
      .sname{font-size:14px;font-weight:800;fill:#15233a}
      .scombo{font-size:10.5px;fill:#36475c}
      .cap{font-size:12px;fill:#9fb3c6}
      .endlabel{font-size:12.5px;font-weight:800;fill:#ffffff}
      .endsub{font-size:10.5px;fill:#d7e3ef}
    </style>
  </defs>

  <rect width="1200" height="580" rx="18" fill="url(#ovbg)"/>
  <circle cx="180" cy="130" r="220" fill="url(#ovorb)"/>
  <circle cx="1030" cy="450" r="240" fill="url(#ovorb)"/>

  <text x="48" y="56" class="title">The Data Engineering Pipeline — End to End</text>
  <text x="48" y="84" class="sub">Raw sources on the left → trustworthy, query-ready data on the right. Watch the data flow through every stage.</text>

  <!-- ===================== CONNECTOR STEMS (bright, color-matched) ===================== -->
  <g stroke-width="3.5" fill="none">
    <path d="M205,300 V176" stroke="#8b7bff"/>
    <path d="M352,300 V404" stroke="#5f86f6"/>
    <path d="M499,300 V176" stroke="#4f9ae8"/>
    <path d="M646,300 V404" stroke="#38b2f0"/>
    <path d="M793,300 V176" stroke="#17b6a0"/>
    <path d="M940,300 V404" stroke="#17b589"/>
    <path d="M1030,300 V176" stroke="#139e74"/>
  </g>

  <!-- ===================== END CAPS ===================== -->
  <g filter="url(#ovsh)">
    <rect x="40" y="268" width="100" height="64" rx="12" fill="#2b3b52" stroke="#6a84a0" stroke-width="1.5"/>
    <rect x="1060" y="268" width="104" height="64" rx="12" fill="#1f6b57" stroke="#2fd0a8" stroke-width="1.5"/>
  </g>
  <text x="90" y="296" text-anchor="middle" class="endlabel">Sources</text>
  <text x="90" y="314" text-anchor="middle" class="endsub">DBs · APIs · events</text>
  <text x="1112" y="296" text-anchor="middle" class="endlabel">Insight</text>
  <text x="1112" y="314" text-anchor="middle" class="endsub">BI · ML · apps</text>

  <!-- ===================== THE PIPE ===================== -->
  <rect x="150" y="292" width="910" height="16" rx="8" fill="url(#ovpipe)"/>
  <line x1="150" y1="300" x2="1060" y2="300" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="3 15" stroke-linecap="round" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- animated data packets -->
  <g>
    <circle r="7.5" fill="#ffffff" filter="url(#dotglow)">
      <animate attributeName="cx" from="150" to="1060" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;300" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="6.5" fill="#b7ffe8" filter="url(#dotglow)">
      <animate attributeName="cx" from="150" to="1060" dur="5s" begin="1.25s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;300" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" begin="1.25s" repeatCount="indefinite"/>
    </circle>
    <circle r="6.5" fill="#cdd6ff" filter="url(#dotglow)">
      <animate attributeName="cx" from="150" to="1060" dur="5s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;300" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- node dots on pipe (white ring, color-matched) -->
  <g>
    <circle cx="205" cy="300" r="8" fill="#8b7bff" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="300" r="8" fill="#5f86f6" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="2.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="499" cy="300" r="8" fill="#4f9ae8" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="646" cy="300" r="8" fill="#38b2f0" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="793" cy="300" r="8" fill="#17b6a0" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="300" r="8" fill="#17b589" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="2.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="300" r="8" fill="#139e74" stroke="#fff" stroke-width="2.5"><animate attributeName="r" values="8;12;8" dur="2.2s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===================== STAGE CARDS: light cards + colored top accent bar + big colored number ===================== -->
  <!-- card template: white rounded rect (shadow), colored accent strip on top, "NN" big colored, title dark, combos dark grey -->

  <!-- 01 Ingestion (top) -->
  <g filter="url(#ovsh)"><rect x="120" y="110" width="176" height="66" rx="12" fill="#ffffff"/></g>
  <path d="M132,110 h152 a12,12 0 0 1 12,12 v4 H120 v-4 a12,12 0 0 1 12,-12 z" fill="#8b7bff"/>
  <text x="134" y="150" class="snum" fill="#6b5cf0">01</text>
  <text x="162" y="150" class="sname">Ingestion</text>
  <text x="134" y="166" class="scombo">Kafka+Debezium · Kafka+Flink · Airbyte+dbt</text>

  <!-- 02 Transformation (bottom) -->
  <g filter="url(#ovsh)"><rect x="264" y="404" width="176" height="66" rx="12" fill="#ffffff"/></g>
  <path d="M276,404 h152 a12,12 0 0 1 12,12 v4 H264 v-4 a12,12 0 0 1 12,-12 z" fill="#5f86f6"/>
  <text x="278" y="444" class="snum" fill="#3f6fe6">02</text>
  <text x="306" y="444" class="sname">Transformation</text>
  <text x="278" y="460" class="scombo">Python+Pandas · PySpark · SQL+dbt</text>

  <!-- 03 Orchestration (top) -->
  <g filter="url(#ovsh)"><rect x="411" y="110" width="176" height="66" rx="12" fill="#ffffff"/></g>
  <path d="M423,110 h152 a12,12 0 0 1 12,12 v4 H411 v-4 a12,12 0 0 1 12,-12 z" fill="#4f9ae8"/>
  <text x="425" y="150" class="snum" fill="#2f82d8">03</text>
  <text x="453" y="150" class="sname">Orchestration</text>
  <text x="425" y="166" class="scombo">Airflow+Python · Docker+Airflow</text>

  <!-- 04 Storage (bottom) -->
  <g filter="url(#ovsh)"><rect x="556" y="404" width="182" height="66" rx="12" fill="#ffffff"/></g>
  <path d="M568,404 h158 a12,12 0 0 1 12,12 v4 H556 v-4 a12,12 0 0 1 12,-12 z" fill="#38b2f0"/>
  <text x="570" y="444" class="snum" fill="#1f93c9">04</text>
  <text x="598" y="444" class="sname">Storage · Lakehouse</text>
  <text x="570" y="460" class="scombo">S3/Spark+Iceberg · Snowflake+dbt · Delta Lake</text>

  <!-- 05 Quality (top) -->
  <g filter="url(#ovsh)"><rect x="705" y="110" width="180" height="66" rx="12" fill="#ffffff"/></g>
  <path d="M717,110 h156 a12,12 0 0 1 12,12 v4 H705 v-4 a12,12 0 0 1 12,-12 z" fill="#17b6a0"/>
  <text x="719" y="150" class="snum" fill="#13937f">05</text>
  <text x="747" y="150" class="sname">Quality · Lineage</text>
  <text x="719" y="166" class="scombo">Great Expectations+Python · DataHub+OpenLineage</text>

  <!-- 06 Deploy (bottom) -->
  <g filter="url(#ovsh)"><rect x="852" y="404" width="176" height="66" rx="12" fill="#ffffff"/></g>
  <path d="M864,404 h152 a12,12 0 0 1 12,12 v4 H852 v-4 a12,12 0 0 1 12,-12 z" fill="#17b589"/>
  <text x="866" y="444" class="snum" fill="#139669">06</text>
  <text x="894" y="444" class="sname">Deploy · IaC</text>
  <text x="866" y="460" class="scombo">Terraform+Cloud · Git+CI/CD</text>

  <!-- 07 Observability (top) -->
  <g filter="url(#ovsh)"><rect x="945" y="110" width="190" height="66" rx="12" fill="#ffffff"/></g>
  <path d="M957,110 h166 a12,12 0 0 1 12,12 v4 H945 v-4 a12,12 0 0 1 12,-12 z" fill="#139e74"/>
  <text x="959" y="150" class="snum" fill="#0f8a63">07</text>
  <text x="987" y="150" class="sname">Observability</text>
  <text x="959" y="166" class="scombo">Grafana+Prometheus · metrics · alerts</text>

  <!-- legend / footer -->
  <rect x="40" y="516" width="1120" height="44" rx="11" fill="#152536" stroke="#2b4056" stroke-width="1.5"/>
  <circle cx="66" cy="538" r="6.5" fill="#ffffff"/><text x="82" y="542" class="cap">moving dots = data flowing through the pipeline</text>
  <rect x="470" y="533" width="20" height="4" rx="2" fill="#5fa0ff"/><text x="500" y="542" class="cap">colored lines connect each stage to the pipe</text>
  <text x="1150" y="542" text-anchor="end" class="cap">by eswaran-hariharan</text>
</svg>
